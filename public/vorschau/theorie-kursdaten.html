<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VKU-Basel Kursdaten Theorievorbereitung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/theorie-kursdaten.css">
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div id="top" class="{{pageCls}}">
<header>
<div class="hdr-in">
<a class="brand" href="index.html">VKU-Basel</a>
<button type="button" class="burger" aria-label="Menü öffnen" aria-controls="hauptnav" aria-expanded="{{menuExp}}" onClick="{{toggleMenu}}"><img src="assets/img/pfeil-blau.png" alt=""></button>
<nav class="{{navCls}}" id="hauptnav" aria-label="Hauptnavigation">
<a href="vku-kursdaten.html">VKU-Kursdaten</a>
<a class="act" href="theorie-kursdaten.html">Theorie</a>
<a href="kombi-angebote.html">Kombi-Angebote</a>
<a href="gutscheine.html">Gutscheine</a>
<a href="faq.html">FAQ</a>
<a href="kontakt.html">Kontakt</a>
</nav>
<span class="tag">Theorie- und VKU-Kurse</span>
</div>
<div class="strasse" aria-hidden="true"></div>
</header>
<nav class="{{ovCls}}" aria-label="Hauptmenü Handy" aria-hidden="{{ovHidden}}">
<div class="mov-in">
<span class="pfosten" aria-hidden="true"></span>
<div class="mov-top"><button type="button" class="burger zu" onClick="{{toggleMenu}}" aria-label="Menü schliessen"><img src="assets/img/pfeil-blau.png" alt=""></button></div>
<div class="stack">
<a class="mw" style="transition-delay: 60ms;" href="vku-kursdaten.html">VKU-Kursdaten</a>
<a class="mw mw-blau" style="transition-delay: 110ms;" href="kombi-angebote.html">Kombi-Angebote</a>
<a class="mw mw-weiss act" style="transition-delay: 160ms;" href="theorie-kursdaten.html">Theorie</a>
<a class="mw mw-orange" style="transition-delay: 210ms;" href="gutscheine.html">Gutscheine</a>
<a class="mw mw-weiss" style="transition-delay: 260ms;" href="faq.html">FAQ</a>
<a class="mw mw-weiss" style="transition-delay: 310ms;" href="kontakt.html">Kontakt</a>
<a class="mw mw-grau" style="transition-delay: 380ms; margin-top: 18px;" href="#">reinis Fahrschule</a>
</div>
<div style="position: relative; z-index: 1; margin-top: auto; padding-top: 40px; display: flex; gap: 14px; align-items: center; color: #fff;">
<img src="assets/img/signal-telefon.png" alt="" style="width: 40px; height: auto;">
<div style="display: flex; flex-direction: column; font-size: 16px; line-height: 1.3;">
<a href="tel:+41796386138" style="color: #fff; font-weight: 700;">+41 79 638 61 38</a>
<span>Burgfelderstrasse 11, 4055 Basel</span>
</div>
</div>
</div>
</nav>

<main style="flex-grow: 1; max-width: 1160px; width: 100%; margin: 0 auto; padding: 36px 24px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px;">
<div style="display: flex; justify-content: center;">
<h1 class="{{ukCls}}">{{title}}<img src="{{ukArrow}}" alt=""></h1>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); column-gap: 56px;">
<sc-for list="{{courses}}" as="c" hint-placeholder-count="3">
<article style="border-top: 1px solid #7f7f7f; padding: 18px 0 22px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-wrap: wrap; gap: 14px 16px; align-items: center; justify-content: space-between;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<h2 style="margin: 0; font-size: 18px; font-weight: 700; text-decoration: underline;">{{c.kind}} {{c.code}}</h2>
<ul class="plan" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, auto); justify-content: start; row-gap: 2px; font-variant-numeric: tabular-nums;">
<sc-for list="{{c.parts}}" as="p" hint-placeholder-count="1">
<li style="display: contents;"><span>{{p.label}}:</span><span class="{{p.dayCls}}" title="{{p.dayTip}}" data-tip="{{p.dayTip}}" tabindex="{{p.dayTab}}">{{p.day}}</span><span aria-hidden="true">|</span><span class="{{p.timeCls}}" title="{{p.timeTip}}" data-tip="{{p.timeTip}}" tabindex="{{p.timeTab}}" style="grid-column: span 4; display: grid; grid-template-columns: subgrid;"><span>{{p.start}}</span><span>bis</span><span>{{p.end}}</span><span>Uhr</span></span></li>
</sc-for>
</ul>
</div>
<div style="display: flex; gap: 10px; align-items: center;">
<div class="ampel" role="img" aria-label="{{c.ampelLabel}}"><b class="{{c.r}}"></b><b class="{{c.y}}"></b><b class="{{c.g}}"></b></div>
<span class="{{c.txtCls}}" style="font-size: 14px; font-weight: 700; line-height: 1.25; text-align: center;">{{c.free}} von 12<br>Plätzen frei</span>
</div>
</div>
<sc-if value="{{c.open}}" hint-placeholder-val="{{true}}">
<div><a class="{{c.btnCls}}" href="{{c.href}}">Jetzt anmelden!</a></div>
</sc-if>
<sc-if value="{{c.full}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 12px; align-items: center;"><img src="assets/img/vk4-09-sackgasse.png" alt="Signal Sackgasse" style="width: 52px; height: 52px;"><strong>Dieser Kurs ist ausgebucht!</strong></div>
</sc-if>
</article>
</sc-for>
</div>

<section style="border-top: 1px solid #7f7f7f; padding-top: 24px; display: flex; flex-wrap: wrap; gap: 20px 28px; align-items: center;">
<img src="assets/img/vk2-13.png" alt="Signal" style="width: 80px; height: 80px;">
<div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 6px;">
<h2 style="margin: 0; font-size: 22px;">Keinen passenden Kurs gefunden?</h2>
<p style="margin: 0;">Um das Angebot deinen Bedürfnissen besser anzupassen, kannst du gerne mitteilen, an welchen Tagen und Zeiten ein Kurs für dich optimal wäre.</p>
</div>
<a class="ww ww-weiss" href="kontakt.html">vku-basel.ch/kontakt</a>
</section>

<div style="display: flex; justify-content: center; gap: 32px;">
<a href="index.html" aria-label="Zurück" style="display: inline-flex;"><img src="assets/img/vk2-33-zurueck.png" alt="" style="width: 64px; height: 64px;"></a>
<a href="#top" aria-label="Zum Seitenanfang" style="display: inline-flex;"><img src="assets/img/vk2-36-nach-oben.png" alt="" style="width: 64px; height: 64px;"></a>
</div>
</main>

<footer class="foot">
<div style="max-width: 1160px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 12px 28px; border-top: 1px solid rgba(31,56,100,0.3);">
<span style="flex: 1 1 320px;">VKU-Basel · ein Angebot der reinis Fahrschule · Burgfelderstrasse 11, 4055 Basel</span>
<a href="#">Impressum</a>
<a href="#">Datenschutz</a>
</div>
</footer>
</div>
</template>
<noscript><p style="padding:24px;font-family:Arial,sans-serif">Für diesen Prototyp bitte JavaScript aktivieren.</p></noscript>
<script src="assets/js/dc-lite.js"></script>
<script src="assets/js/theorie-kursdaten.js"></script>
</body>
</html>
