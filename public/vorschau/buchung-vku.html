<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VKU-Basel Buchung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/buchung-vku.css">
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div class="page vku">
<header>
<div class="hdr-in">
<a class="brand" href="index.html">VKU-Basel</a>
<span class="tag">Theorie- und VKU-Kurse</span>
</div>
<div class="strasse" aria-hidden="true"></div>
</header>

<main style="flex-grow: 1; max-width: 900px; width: 100%; margin: 0 auto; padding: 36px 24px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px;">
<div style="display: flex; justify-content: center;">
<h1 class="uk uk-gruen">{{title}}<img src="assets/img/pfeil-gruen.png" alt=""></h1>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px 28px; justify-content: center;" aria-label="Schritte">
<li class="{{st1}}"><i>1</i>Auswahl</li>
<li class="{{st2}}"><i>2</i>Teilnehmer:in</li>
<li class="{{st3}}"><i>3</i>Bezahlen</li>
<li class="{{st4}}"><i>4</i>Bestätigung</li>
</ol>

<sc-if value="{{s1}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 18px;">
<section class="box">
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; align-items: baseline;">
<h2 style="margin: 0; font-size: 20px; text-decoration: underline;">VKU-Kurs VK270101</h2>
<a href="vku-kursdaten.html" style="font-size: 16px;">Anderen Kurs wählen</a>
</div>
<p style="margin: 0;">Jeden Montag vom 04.01. bis 25.01.27, jeweils 15:00 bis 17:00 Uhr, <strong>Teil 3 am Mo 18.01. 16:00 bis 18:00 Uhr</strong></p>
</section>

<section class="box">
<h2 style="margin: 0; font-size: 20px;">Dazu buchen und sparen</h2>
<label class="{{theoCls}}"><input type="checkbox" checked="{{theo}}" onChange="{{toggleTheo}}"><span><strong>Theorievorbereitung TV270101</strong>, Mi 13.01.27, 19:00 bis 21:00 Uhr<br><span style="font-size: 16px;">Einzeln CHF 25.25, zusammen mit dem VKU CHF 13.05</span></span></label>
<p style="margin: 6px 0 0; font-weight: 600;">Fahrstunden-Abo bei einer Partnerfahrschule</p>
<label class="{{bNoneCls}}"><input type="radio" name="bundle" checked="{{bNone}}" onChange="{{pickNone}}"><span>Ohne Fahrstunden, nur VKU</span></label>
<label class="{{bDorisCls}}"><input type="radio" name="bundle" checked="{{bDoris}}" onChange="{{pickDoris}}"><span><strong>Doris, Fahrschule Doris Studer</strong> · Basel-Stadt<br><span style="font-size: 16px;">VKU + 5 Fahrstunden à 50 Minuten: <span class="rot">CHF 524.95</span> statt 564.95</span></span></label>
<label class="{{bGabyCls}}"><input type="radio" name="bundle" checked="{{bGaby}}" onChange="{{pickGaby}}"><span><strong>Gaby, Step by Step</strong> · Region Zuzgen<br><span style="font-size: 16px;">VKU + 5 Fahrstunden à 50 Minuten: <span class="rot">CHF 479.95</span> statt 698.95</span></span></label>
</section>

<section class="box">
<div class="sg" role="table" aria-label="Preisübersicht">
<div class="row hd" role="row">
<div class="h" role="columnheader"><img src="assets/img/vk1-23.png" alt="">Gewählt</div>
<div class="h" role="columnheader"><img src="assets/img/vk1-30.png" alt="">Preis normal</div>
<div class="h" role="columnheader"><img src="assets/img/vk1-10.png" alt="">Rabatt</div>
<div class="h" role="columnheader"><img src="assets/img/vk2-65b.png" alt="">Dein Preis</div>
</div>
<sc-for list="{{lines}}" as="l" hint-placeholder-count="2">
<div class="row" role="row"><div class="c1" role="cell">{{l.name}}</div><div class="n" role="cell">{{l.list}}</div><div class="n" role="cell">{{l.disc}}</div><div class="n b" role="cell">{{l.price}}</div></div>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;">
<label class="f" style="flex: 1 1 240px;">Gutscheincode<input type="text" placeholder="z.B. GS2611-K7QF-3" value="{{code}}" onChange="{{setCode}}"></label>
<button type="button" onClick="{{applyCode}}" style="font: inherit; font-weight: 600; min-height: 48px; padding: 8px 20px 4px; border-radius: 6px; border: 2px solid #000; background: #fff; cursor: pointer;">Einlösen</button>
</div>
<sc-if value="{{codeMsg}}" hint-placeholder-val="{{false}}"><p style="margin: 0; font-size: 16px;">{{codeMsg}}</p></sc-if>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; border-top: 2px solid #000; padding-top: 12px; font-size: 20px; font-weight: 700;">
<span>Dein individuelles Programm kostet:</span><span>CHF {{total}}</span>
</div>
</section>
<div style="display: flex; justify-content: center;"><button type="button" class="ww" onClick="{{go2}}">Weiter mit der Auswahl</button></div>
</div>
</sc-if>

<sc-if value="{{s2}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px;">
<section class="box">
<h2 style="margin: 0; font-size: 20px;">Wer nimmt teil?</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px;">
<label class="f">Vorname<input type="text" autocomplete="given-name"></label>
<label class="f">Nachname<input type="text" autocomplete="family-name"></label>
<label class="f">Geburtsdatum<input type="text" placeholder="TT.MM.JJJJ"></label>
<label class="f">Handynummer<input type="tel" placeholder="+41 79 …"></label>
<label class="f">{{emailLabel}}<input type="email"></label>
<label class="f">Strasse und Nr.<input type="text" autocomplete="street-address"></label>
<label class="f">PLZ<input type="text" inputmode="numeric"></label>
<label class="f">Ort<input type="text"></label>
</div>
<label class="{{otherCls}}"><input type="checkbox" checked="{{forOther}}" onChange="{{toggleOther}}"><span>Ich buche und bezahle für eine andere Person, z.B. als Elternteil</span></label>
</section>
<sc-if value="{{forOther}}" hint-placeholder-val="{{false}}">
<section class="box">
<h2 style="margin: 0; font-size: 20px;">Buchende Person</h2>
<p style="margin: 0; font-size: 16px;">Alle Bestätigungen und die Rechnung gehen an diese E-Mail-Adresse.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px;">
<label class="f">Vorname<input type="text"></label>
<label class="f">Nachname<input type="text"></label>
<label class="f">E-Mail<input type="email" required=""></label>
<label class="f">Handynummer<input type="tel"></label>
<label class="f">Strasse und Nr.<input type="text"></label>
<label class="f">PLZ und Ort<input type="text"></label>
</div>
</section>
</sc-if>
<section class="box">
<sc-if value="{{hasBundle}}" hint-placeholder-val="{{false}}">
<label class="opt"><input type="checkbox"><span>Ich bin einverstanden, dass meine Kontaktdaten an die gewählte Partnerfahrschule weitergegeben werden.</span></label>
</sc-if>
<label class="opt"><input type="checkbox"><span>Ich akzeptiere die <a href="#">AGB</a> und die <a href="#">Datenschutzerklärung</a>.</span></label>
</section>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px;">
<button type="button" class="back" onClick="{{go1}}"><img src="assets/img/vk2-33-zurueck.png" alt="">Zurück</button>
<button type="button" class="ww" onClick="{{go3}}">Weiter zum Bezahlen</button>
</div>
</div>
</sc-if>

<sc-if value="{{s3}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px;">
<section class="box">
<h2 style="margin: 0; font-size: 20px;">Wie möchtest du bezahlen?</h2>
<label class="{{pCardCls}}"><input type="radio" name="pay" checked="{{pCard}}" onChange="{{payCard}}"><span><strong>Kreditkarte</strong> · sofort bestätigt</span></label>
<label class="{{pTwintCls}}"><input type="radio" name="pay" checked="{{pTwint}}" onChange="{{payTwint}}"><span><strong>TWINT</strong> · sofort bestätigt</span></label>
<label class="{{pInvCls}}"><input type="radio" name="pay" checked="{{pInv}}" onChange="{{payInv}}"><span><strong>Rechnung</strong> · PDF mit QR-Einzahlungsschein per Mail</span></label>
<label class="{{pCashCls}}"><input type="radio" name="pay" checked="{{pCash}}" onChange="{{payCash}}"><span><strong>Bar am 1. Kurstag</strong> · vor Kursbeginn vor Ort</span></label>
<p style="margin: 0; padding: 12px 14px; background: #FFF2CC; border-radius: 8px; font-size: 16px;"><strong>Wichtig:</strong> Der Kurs muss vor Kursbeginn bezahlt sein. {{payHint}}</p>
</section>
<section class="box" style="flex-direction: row; flex-wrap: wrap; justify-content: space-between; font-size: 20px; font-weight: 700;">
<span>Total</span><span>CHF {{total}}</span>
</section>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px;">
<button type="button" class="back" onClick="{{go2}}"><img src="assets/img/vk2-33-zurueck.png" alt="">Zurück</button>
<button type="button" class="ww" onClick="{{go4}}">{{payBtn}}</button>
</div>
</div>
</sc-if>

<sc-if value="{{s4}}" hint-placeholder-val="{{false}}">
<section class="box" style="align-items: center; text-align: center; padding: 36px 22px;">
<img src="assets/img/vk2-65b.png" alt="" style="width: 88px; height: 88px;">
<h2 style="margin: 0; font-size: 30px;">Du bist angemeldet!</h2>
<p style="margin: 0;">Buchung <strong>B26-000123</strong> · VKU-Kurs VK270101 · Start Mo 04.01.27, 15:00 Uhr</p>
<p style="margin: 0; max-width: 560px;">{{doneHint}}</p>
<div style="width: 100%; max-width: 560px; text-align: left; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #c4c9d1; border-bottom: 1px solid #c4c9d1; padding: 16px 0;">
<strong>Deine Termine</strong>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px;">
<li>Teil 1: Mo 04.01.27 | 15:00 bis 17:00 Uhr</li>
<li>Teil 2: Mo 11.01.27 | 15:00 bis 17:00 Uhr</li>
<li>Teil 3: Mo 18.01.27 | <strong>16:00 bis 18:00 Uhr</strong></li>
<li>Teil 4: Mo 25.01.27 | 15:00 bis 17:00 Uhr</li>
</ul>
<div><a class="ww ww-weiss" href="{{ics}}" download="VKU-Basel-VK270101.ics">In den Kalender speichern</a></div>
<p style="margin: 0; font-size: 15px;">Funktioniert mit Apple Kalender, Google Kalender und Outlook. Die Termine liegen auch der Bestätigungsmail bei.</p>
</div>
<p style="margin: 0; max-width: 560px; font-size: 16px;">Über den Link in der Bestätigung kannst du bis 1 Stunde vor Teil 1 selbst umbuchen oder annullieren.</p>
<a class="ww" href="meine-buchung.html">Meine Buchung ansehen</a>
<a href="index.html">Zur Startseite</a>
</section>
</sc-if>
</main>
</div>
</template>
<noscript><p style="padding:24px;font-family:Arial,sans-serif">Für diesen Prototyp bitte JavaScript aktivieren.</p></noscript>
<script src="assets/js/dc-lite.js"></script>
<script src="assets/js/buchung-vku.js"></script>
</body>
</html>
